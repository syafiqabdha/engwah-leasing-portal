version: '3.8'

services:
  # Database Service (internal only, not exposed)
  db:
    image: pgvector/pgvector:pg16
    container_name: ew_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pancatz_leasing}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-pancatz_leasing}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net

  # Backend API Service (internal only — Nginx proxies /api to it)
  backend:
    build: ./backend
    container_name: ew_api
    restart: always
    # Port NOT exposed externally — Nginx handles all traffic
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pancatz_leasing}
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_URL: ${LLM_API_URL:-http://ollama:11434/api/chat}
      # CORS: same-origin via Nginx proxy — only need the public hostname here
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://ewpl-svr.tail5e6f37.ts.net,https://ewpl-svr.tail5e6f37.ts.net,http://localhost,http://localhost:5173}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./.workspace:/app/.workspace
    networks:
      - app-net

  # Frontend + Reverse Proxy (Nginx serves UI on port 80 AND proxies /api to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: ew_ui
    restart: always
    ports:
      - "0.0.0.0:80:80" # HTTP — accessible from network
    networks:
      - app-net

  # Ollama Service (Optional: Exclude if using a cloud LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: ew_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-net

volumes:
  db_data:
  ollama_data:


networks:
  app-net:
